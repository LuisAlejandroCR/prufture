# render.yaml: Render Blueprint for the Prufture relayer/index API (apps/api, Hono + Node).
# Needs a persistent writable disk so proofs survive a redeploy (apps/api/src/store.ts,
# STORE_PATH). Distinct from vercel.json, which deploys the Next.js public site (apps/backend).
#
# NOTE: persistent disks require a paid instance ("starter" or above) — Render's free web
# service has an ephemeral filesystem. On free tier the store resets on every cold start and
# redeploy; Fly.io or Railway volumes are alternatives.

services:
  - type: web
    name: prufture-api
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: .
    buildCommand: npm ci
    startCommand: npm run start --workspace apps/api
    healthCheckPath: /health
    autoDeploy: false
    disk:
      name: prufture-store
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      # Durable proof store on the mounted disk.
      - key: STORE_PATH
        value: /data/store.json
      # Public site base, used to build the verifyUrl in POST /notify: https://prufture.voltarut.com
      - key: VERIFY_BASE_URL
        sync: false
      # On-chain attestation (Base Sepolia). Any JSON-RPC endpoint for the chain; the provider is
      # a configuration choice. Absent -> /sync degrades to "synced".
      - key: RPC_URL
        sync: false
      # Extra endpoints, comma-separated, tried in order when RPC_URL fails.
      - key: RPC_FALLBACK_URLS
        sync: false
      # DEPRECATED fallback name, honoured only when RPC_URL is unset. Drop once migrated.
      - key: DWELLIR_RPC_URL
        sync: false
      - key: RELAYER_PRIVATE_KEY
        sync: false
      # Submitter adapter: "local-key" (default), "openzeppelin-relayer", or "none". Unknown
      # names fail closed to "none".
      - key: ATTESTATION_SUBMITTER
        sync: false
      # OpenZeppelin Relayer adapter only. The relayer holds the key; OZ_RELAYER_ADDRESS pins it.
      - key: OZ_RELAYER_URL
        sync: false
      - key: OZ_RELAYER_ID
        sync: false
      - key: OZ_RELAYER_API_KEY
        sync: false
      - key: OZ_RELAYER_ADDRESS
        sync: false
      - key: EAS_SCHEMA_UID
        sync: false
      - key: EAS_CONTRACT_ADDRESS
        value: "0x4200000000000000000000000000000000000021"
      - key: BASE_SEPOLIA_CHAIN_ID
        value: "84532"
      # Liveness: OFF unless "aws" (Rekognition Face Liveness, session flow). Unset -> every
      # liveness route answers degraded and the app skips the face check.
      - key: LIVENESS_PROVIDER
        sync: false
      # aws only. Least-privilege IAM: rekognition:CreateFaceLivenessSession and
      # rekognition:GetFaceLivenessSessionResults, nothing else.
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      # 0..100, default 90.
      - key: LIVENESS_MIN_CONFIDENCE
        sync: false
      # >= 32 chars, keeps liveness tickets valid across restarts.
      - key: LIVENESS_TICKET_SECRET
        sync: false
      # "true" once every build in the field sends the evidence token with /liveness-result and
      # /precise-location.
      - key: REQUIRE_EVIDENCE_TOKEN
        sync: false
      # Programme pass: "semaphore" turns it on.
      - key: PERSONHOOD_PROVIDER
        sync: false
      # Who may enrol members and start rounds: the dashboard's COORDINATOR_APP_USER_ID (comma
      # separated). Empty closes enrolment.
      - key: PERSONHOOD_ADMIN_APP_USER_IDS
        sync: false
      # Paid sessions per UTC day across all callers (default 200; 0 closes the route).
      - key: LIVENESS_SESSION_DAILY_CAP
        sync: false
      # Proxies appending to X-Forwarded-For in front of the api (default 1). Picks the per-IP key.
      - key: TRUSTED_PROXY_HOPS
        sync: false
      # Delivery channels. Absent -> each channel degrades, /notify returns sent:false.
      - key: KAPSO_API_KEY
        sync: false
      - key: KAPSO_PHONE_NUMBER_ID
        sync: false
      - key: KAPSO_API_BASE
        value: https://app.kapso.ai/api/v1
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_API_BASE
        value: https://api.resend.com
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Coordinator plan: server-side RevenueCat check behind /coordinator/*. Absent -> every
      # coordinator call answers 503 and the app keeps the review tools locked. GET /health reports
      # whether all three are set (never their values). The entitlement id is the internal entl...
      # id from Product catalog -> Entitlements, not the lookup key "coordinator_pro".
      - key: REVENUECAT_SECRET_KEY
        sync: false
      - key: REVENUECAT_PROJECT_ID
        sync: false
      - key: REVENUECAT_COORDINATOR_ENTITLEMENT_ID
        sync: false
      - key: REVENUECAT_API_BASE
        value: https://api.revenuecat.com/v2
