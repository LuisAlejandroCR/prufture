# Cargo.toml: on-device Groth16 prover for the Semaphore v4 circuit (depth 10), bound for the
# Expo native module. Inputs are built in JS; this crate only computes the witness and the proof.
[package]
name = "prufture-zk-prover"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "prufture_zk_prover"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "prove-cli"
path = "src/bin/prove_cli.rs"

[dependencies]
anyhow = "1"
serde_json = "1"
circom-prover = { version = "=0.1.4", features = ["circom-witnesscalc"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
